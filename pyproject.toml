[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diflow"
version = "0.0.1"
description = "Directional inference and geographic visualization of gene flow among populations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pauline Owusu-Ansah"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "pyproj>=3.6"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
demography = ["dadi>=2.3"]
validation = ["msprime>=1.3", "tskit>=0.6"]

[project.scripts]
diflow = "diflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/diflow"]
